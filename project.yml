name: GanaBajana
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    DEVELOPMENT_TEAM: W2NS9DM63G
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  YouTubeKit:
    path: Vendor/YouTubeKit
  FFmpegBridge:
    path: Vendor/FFmpegBridge
schemes:
  GanaBajana:
    build:
      targets:
        GanaBajana: all
    run:
      config: Debug
      storeKitConfiguration: Resources/TipJar.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - GanaBajanaTests
        - GanaBajanaUITests
    archive:
      config: Release
  GanaBajanaLive:
    build:
      targets:
        GanaBajana: all
    test:
      config: Debug
      environmentVariables:
        GANABAJANA_LIVE_TESTS: "1"
        GANABAJANA_LYRICS_DNS_RESOLVER: cloudflare
      targets:
        - GanaBajanaTests
  GanaBajanaLiveUI:
    build:
      targets:
        GanaBajana: all
    test:
      config: Debug
      environmentVariables:
        GANABAJANA_LIVE_UI: "1"
      targets:
        - GanaBajanaUITests
targets:
  GanaBajana:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: YouTubeKit
      - package: FFmpegBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agraabhi.ganabajana
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Beat AppIcon-Dhol AppIcon-Notes AppIcon-Headphones AppIcon-Vinyl AppIcon-Boombox AppIcon-Cassette AppIcon-Speaker AppIcon-Waves AppIcon-Peacock AppIcon-Mic AppIcon-Tabla AppIcon-Sargam AppIcon-Bansuri"
        ENABLE_DEBUG_DYLIB: NO
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: TipJar.storekit
    info:
      path: build/GanaBajana-Info.plist
      properties:
        CFBundleDisplayName: Breezy
        MusicBrainzContactURL: https://gist.github.com/aagrawal207/95acc71ba167fb754c435de17d256e59#file-support-md
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.agraabhi.ganabajana.releases]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.agraabhi.ganabajana
            CFBundleURLSchemes: [ganabajana]
  GanaBajanaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - Fixtures
      - path: Tests/Fixtures
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.agraabhi.ganabajana.tests
    dependencies:
      - target: GanaBajana
  GanaBajanaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
      - path: Resources/TipJar.storekit
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.agraabhi.ganabajana.uitests
        TEST_TARGET_NAME: GanaBajana
    dependencies:
      - target: GanaBajana
