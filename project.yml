name: GanaBajana
configs:
  Debug: debug
  Release: release
  Debug-CarPlay: debug
  Release-CarPlay: release
options:
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    # Mac Catalyst 18 runs on macOS 15; test bundles otherwise default to the SDK's macOS version.
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: W2NS9DM63G
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "11"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  YouTubeKit:
    path: Vendor/YouTubeKit
  FFmpegBridge:
    path: Vendor/FFmpegBridge
schemes:
  GanaBajanaCarPlay:
    build:
      targets:
        GanaBajana: all
    run:
      config: Debug-CarPlay
    test:
      config: Debug-CarPlay
      targets:
        - GanaBajanaTests
    archive:
      config: Release-CarPlay
  GanaBajanaWatch:
    build:
      targets:
        GanaBajanaWatch: all
        GanaBajana: all
    run:
      config: Debug
      executable: GanaBajanaWatch
    test:
      config: Debug
      targets:
        - GanaBajanaWatchTests
        - GanaBajanaWatchUITests
    archive:
      config: Release
  GanaBajana:
    build:
      targets:
        GanaBajana: all
    run:
      config: Debug
      storeKitConfiguration: Resources/TipJar.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - GanaBajanaTests
        - GanaBajanaUITests
    archive:
      config: Release
  GanaBajanaMac:
    build:
      targets:
        GanaBajana: all
    run:
      config: Debug
      storeKitConfiguration: Resources/TipJar.storekit
    test:
      config: Debug
      targets:
        - GanaBajanaTests
    archive:
      config: Release
  GanaBajanaLive:
    build:
      targets:
        GanaBajana: all
    test:
      config: Debug
      environmentVariables:
        GANABAJANA_LIVE_TESTS: "1"
        GANABAJANA_LYRICS_DNS_RESOLVER: cloudflare
      targets:
        - GanaBajanaTests
  GanaBajanaLiveUI:
    build:
      targets:
        GanaBajana: all
    test:
      config: Debug
      environmentVariables:
        GANABAJANA_LIVE_UI: "1"
      targets:
        - GanaBajanaUITests
targets:
  GanaBajana:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      - path: WatchApp/Sources/Connectivity
    dependencies:
      - package: YouTubeKit
      - package: FFmpegBridge
      - target: BreezyWidgets
        embed: true
        link: false
      - target: GanaBajanaWatch
        embed: true
        link: false
        platformFilter: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agraabhi.ganabajana
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Signing/MacCatalyst.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Beat AppIcon-LeafPaper AppIcon-LeafSky AppIcon-LeafBlossom AppIcon-LeafMidnight AppIcon-LeafViolet AppIcon-LeafSunset AppIcon-LeafMono AppIcon-Thorn AppIcon-Sonnet AppIcon-ThornEdge AppIcon-ThornFrost AppIcon-ThornNoir AppIcon-ThornVenom AppIcon-ThornDusk AppIcon-ThornBlush AppIcon-Notes AppIcon-Boombox AppIcon-Speaker AppIcon-Waves"
        ENABLE_DEBUG_DYLIB: NO
        CODE_SIGN_ENTITLEMENTS: Signing/iCloud.entitlements
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: TipJar.storekit
        Debug-CarPlay:
          CODE_SIGN_ENTITLEMENTS: Signing/CarPlay.entitlements
        Release-CarPlay:
          CODE_SIGN_ENTITLEMENTS: Signing/CarPlay.entitlements
          EXCLUDED_SOURCE_FILE_NAMES: TipJar.storekit
    info:
      path: build/GanaBajana-Info.plist
      properties:
        CFBundleDisplayName: Velvet Thorn
        MusicBrainzContactURL: https://gist.github.com/aagrawal207/95acc71ba167fb754c435de17d256e59#file-support-md
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio, fetch]
        NSMotionUsageDescription: "Velvet Thorn can use motion activity to recognize active listening for moment mixes. This is optional and stays on this device."
        BGTaskSchedulerPermittedIdentifiers: [com.agraabhi.ganabajana.releases, com.agraabhi.ganabajana.mixes]
        NSUserActivityTypes: [com.agraabhi.ganabajana.playback]
        NSBonjourServices: [_ganabajana._tcp]
        NSLocalNetworkUsageDescription: "Velvet Thorn uses your local network to find your other devices, show what they are playing, and move playback between them."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleExternalDisplayNonInteractive:
              - UISceneConfigurationName: TV Lyrics
                UISceneClassName: UIWindowScene
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).TVLyricsSceneDelegate
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneClassName: CPTemplateApplicationScene
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.agraabhi.ganabajana
            CFBundleURLSchemes: [ganabajana]
  BreezyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetExtension
      - path: Sources/Core/Widgets
      - path: Sources/Core/MusicModels.swift
      - path: Sources/Core/AlbumDescription.swift
      - path: Sources/Core/AppAccent.swift
      - path: Sources/Core/GeneratedPlaylist.swift
      - path: Sources/UI/AppPalette.swift
      - path: Sources/Widgets/Presentation
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agraabhi.ganabajana.widgets
        TARGETED_DEVICE_FAMILY: "1,2,6"
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: Signing/Widgets.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Signing/WidgetsMac.entitlements
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
    info:
      path: build/BreezyWidgets-Info.plist
      properties:
        CFBundleDisplayName: Velvet Thorn
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  GanaBajanaWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp/Sources
      - path: WatchApp/Resources
      - path: Sources/Core/Companion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agraabhi.ganabajana.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
    info:
      path: build/GanaBajanaWatch-Info.plist
      properties:
        CFBundleDisplayName: Velvet Thorn
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.agraabhi.ganabajana
        WKRunsIndependentlyOfCompanionApp: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
  GanaBajanaWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: WatchTests
      - path: Tests/WatchTestSupport.swift
      - path: Tests/CompanionProtocolTests.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.agraabhi.ganabajana.watchkitapp.tests
    dependencies:
      - target: GanaBajanaWatch
  GanaBajanaWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: WatchUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.agraabhi.ganabajana.watchkitapp.uitests
        TARGETED_DEVICE_FAMILY: "4"
        TEST_TARGET_NAME: GanaBajanaWatch
    dependencies:
      - target: GanaBajanaWatch
  GanaBajanaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - Fixtures
      - path: Tests/Fixtures
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.agraabhi.ganabajana.tests
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
    dependencies:
      - target: GanaBajana
  GanaBajanaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
      - path: Resources/TipJar.storekit
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.agraabhi.ganabajana.uitests
        TEST_TARGET_NAME: GanaBajana
    dependencies:
      - target: GanaBajana
